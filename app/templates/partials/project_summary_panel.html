<h2>Project Summary</h2>
<div class="detail-list">
    <div class="detail-block">
        <div class="detail-label">Project Name</div>
        <div class="detail-value">{{ project.name }}</div>
    </div>
    <div class="detail-block">
        <div class="detail-label">Product Idea</div>
        <div class="detail-value preserve">{{ project.product_idea }}</div>
    </div>
    <div class="detail-block">
        <div class="detail-label">Excluded Scope</div>
        <div class="detail-value preserve">{{ project.excluded_scope }}</div>
    </div>
    <div class="detail-block">
        <div class="detail-label">Completion Contract</div>
        <div class="detail-value preserve">{{ project.completion_contract }}</div>
    </div>
</div>
