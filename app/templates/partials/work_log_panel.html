<div class="section-header">
    <h2>Recent Work Log</h2>
    <span class="count-badge">{{ recent_logs|length }}</span>
</div>

<form method="post" action="/projects/{{ project.id }}/work-log" class="form-grid">
    <label>
        <span>Command / Work</span>
        <textarea name="command_text" rows="2" required placeholder="Describe what you just did"></textarea>
    </label>
    <label>
        <span>Notes</span>
        <textarea name="notes" rows="2" placeholder="Optional context"></textarea>
    </label>
    <div class="actions">
        <button type="submit">Log Work</button>
    </div>
</form>

<div class="actions">
    <form method="post" action="/projects/{{ project.id }}/ingest-terminal">
        <button type="submit">Ingest Terminal Session</button>
    </form>
</div>

{% if recent_logs %}
    <div class="stack-list">
        {% for log in recent_logs %}
            <div class="list-item">
                <div class="item-meta">{{ log.ts }}</div>
                <div class="detail-value preserve">{{ log.command_text }}</div>
                {% if log.notes %}
                    <div class="detail-value preserve">{{ log.notes }}</div>
                {% endif %}
            </div>
        {% endfor %}
    </div>
{% else %}
    <div class="empty-state">No work logs yet.</div>
{% endif %}
