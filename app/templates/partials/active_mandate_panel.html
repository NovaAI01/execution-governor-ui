<h2>Active Mandate</h2>
{% if active_mandate %}
    <div class="detail-list">
        <div class="detail-block">
            <div class="detail-label">Title</div>
            <div class="detail-value">{{ active_mandate.title }}</div>
        </div>
        <div class="detail-block">
            <div class="detail-label">Objective</div>
            <div class="detail-value preserve">{{ active_mandate.objective }}</div>
        </div>
        <div class="detail-block">
            <div class="detail-label">Required Evidence Summary</div>
            <div class="detail-value preserve">{{ active_mandate.evidence_summary }}</div>
        </div>
    </div>
{% else %}
    <div class="empty-state">No active mandate. Activate a draft mandate under the current active capability.</div>
{% endif %}
