<section class="overview-metrics">
    <div class="metric-card">
        <div class="metric-label">Draft Capabilities</div>
        <div class="metric-value">{{ draft_capability_count }}</div>
    </div>
    <div class="metric-card">
        <div class="metric-label">Active Capabilities</div>
        <div class="metric-value">{{ active_capability_count }}</div>
    </div>
    <div class="metric-card">
        <div class="metric-label">Active Mandates</div>
        <div class="metric-value">{{ active_mandate_count }}</div>
    </div>
    <div class="metric-card">
        <div class="metric-label">Completed Mandates</div>
        <div class="metric-value">{{ completed_mandates|length }}</div>
    </div>
</section>
