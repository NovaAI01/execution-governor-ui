<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | Execution Governor UI</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="brand"><a href="/projects">Execution Governor UI v0</a></div>
        <nav class="nav">
            {% if project %}
                <a href="/projects/{{ project.id }}/setup">Project Setup</a>
                <a href="/projects/{{ project.id }}/capabilities">Capability Registry</a>
                <a href="/projects/{{ project.id }}/mandates">Mandate Registry</a>
                <a href="/projects/{{ project.id }}">Project Overview</a>
                <a href="/projects/{{ project.id }}/code-graph">Code Graph</a>
            {% else %}
                <a href="/projects">Projects</a>
            {% endif %}
        </nav>
    </header>

    <main class="container">
        <div class="page-header">
            <h1>{{ page_title }}</h1>
        </div>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
